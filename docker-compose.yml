services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - esdata:/usr/share/elasticsearch/data

  api:
    build: ./backend
    environment:
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - ES_INDEX=${ES_INDEX:-trec-covid}
      - EVAL_DEPTH=${EVAL_DEPTH:-1000}
    ports:
      - "8000:8000"
    volumes:
      - irdatasets:/root/.ir_datasets
    depends_on:
      - elasticsearch

  frontend:
    build: ./frontend
    environment:
      - API_URL=${API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  esdata:
  irdatasets:
